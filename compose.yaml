name: eparole

# Convention de ports : port standard précédé de 5 (docs/22-DOCKER-SETUP.md).
# Les ports hôtes de db, storage et mail sont liés à 127.0.0.1 : jamais exposés sur le réseau.

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-eparole_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-eparole}
      EPAROLE_APP_USER: ${POSTGRES_APP_USER:-eparole_app}
      EPAROLE_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD manquant}
      EPAROLE_TEST_DB: ${POSTGRES_TEST_DB:-eparole_test}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - eparole_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &default-logging
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: >-
      mini -dir=/data -ip.bind=0.0.0.0 -admin.ui=false
      -bucket=${S3_BUCKET_PUBLIC:-eparole-public},${S3_BUCKET_PRIVATE:-eparole-private}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID manquant}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY manquant}
    ports:
      - "127.0.0.1:${S3_PORT:-58333}:8333"
    volumes:
      - eparole_s3data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  mail:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-58025}:8025"
      - "127.0.0.1:${SMTP_PORT:-51025}:1025"
    networks: [internal]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  migrate:
    profiles: [full]
    build: { context: ., target: build }
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    env_file: [.env]
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_OWNER_USER:-eparole_owner}:${POSTGRES_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-eparole}
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  web:
    profiles: [full]
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-eparole_app}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB:-eparole}
      S3_ENDPOINT: http://storage:8333
      SMTP_HOST: mail
      SMTP_PORT: "1025"
    ports:
      - "${WEB_PORT:-53000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_healthy }
      mail: { condition: service_healthy }
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  worker:
    profiles: [full]
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-eparole_app}:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB:-eparole}
      S3_ENDPOINT: http://storage:8333
      SMTP_HOST: mail
      SMTP_PORT: "1025"
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    logging: *default-logging

networks:
  edge: {}
  internal: {}

volumes:
  eparole_pgdata: {}
  eparole_s3data: {}
